# Native dependencies required when argon2 falls back to node-gyp on Node 22.
# Secrets must be provided by the deployment environment, never at build time.

[variables]
NIXPACKS_NODE_VERSION = "22"
PYTHON = "python3"
NPM_CONFIG_PYTHON = "python3"
PNPM_VERSION = "9.12.0"

[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake", "pkg-config"]
cmds = [
  "corepack enable pnpm",
  "corepack install --global pnpm@9.12.0",
  "test \"$(pnpm --version)\" = \"9.12.0\""
]

[phases.install]
cmds = ["pnpm install --frozen-lockfile --prod=false"]
