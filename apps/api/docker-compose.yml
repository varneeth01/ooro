services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ooro
      POSTGRES_PASSWORD: ooro
      POSTGRES_DB: ooro
    ports: ["5432:5432"]
    volumes: ["ooro-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  ooro-postgres:
