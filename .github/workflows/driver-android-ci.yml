name: OORO Driver Android CI
on:
  pull_request:
    paths:
      - "apps/driver-android/**"
      - ".github/workflows/driver-android-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/driver-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Unit tests, lint, debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: driver-build-reports
          path: |
            apps/driver-android/app/build/reports
            apps/driver-android/app/build/test-results
          retention-days: 7
