name: Screen Player Android CI

on:
  pull_request:
    paths:
      - "apps/screen-android/**"
      - ".github/workflows/screen-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-player:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/screen-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Test, lint, assemble APK and compile instrumentation APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest \
            -PuseMockBackend=false \
            -PdeviceApiBaseUrl=https://api-staging.theooro.com
      - name: Upload Android diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screen-player-android-reports
          path: |
            apps/screen-android/app/build/reports
            apps/screen-android/app/build/test-results
            apps/screen-android/app/build/outputs
          retention-days: 7
