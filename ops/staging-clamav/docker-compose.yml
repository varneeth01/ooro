services:
  clamav:
    image: clamav/clamav:1.4.3_base
    restart: unless-stopped
    networks:
      - ooro-staging-private
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  ooro-staging-private:
    name: ooro-staging-private
    internal: true
