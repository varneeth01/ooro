[build]
  base = "."
  # Generate Prisma before Next's root-app type checker runs. The payment
  # function remains isolated from Prisma at runtime.
  command = "pnpm --filter @ooro/api exec prisma generate && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Prisma Client resolves its generated runtime through the hidden
  # node_modules/.prisma tree. Keep that runtime with the API function bundle.
  # Keep both Prisma's generated client and the package shim in every
  # Netlify function zip. Without the generated client, the function crashes
  # at module load with: Cannot find module '.prisma/client/default'.
  included_files = ["node_modules/.prisma/client/**", "node_modules/@prisma/client/**"]


# Public checkout must bypass the Prisma-backed backend function entirely.
[[redirects]]
  from = "/api/public/campaign-packages"
  to = "/.netlify/functions/payments/campaign-packages"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/campaign-orders/verify"
  to = "/.netlify/functions/payments/campaign-orders/verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/campaign-orders"
  to = "/.netlify/functions/payments/campaign-orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/razorpay"
  to = "/.netlify/functions/payments/webhooks/razorpay"
  status = 200
  force = true

# The Next.js app owns the same-origin `/api/*` routes, including web auth
# (`/api/auth`) and its direct Prisma store. Backend-only clients should use
# the Railway API URL directly; forwarding this wildcard to the standalone
# function bypasses Next route handlers and makes web signup impossible.

# Keep one canonical origin for search engines. Point all four domains at this
# Netlify site, then the aliases will consolidate their SEO signals here.
[[redirects]]
  from = "/*"
  to = "https://theooro.com/:splat"
  status = 301
  force = true
  conditions = { Host = ["ooro.media", "www.ooro.media", "ooro.network", "www.ooro.network", "ooro.digital", "www.ooro.digital", "oroo.tech", "www.oroo.tech"] }

[[plugins]]
  package = "@netlify/plugin-nextjs"
