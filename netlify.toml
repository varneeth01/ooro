[build]
  base = "."
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Do not copy workspace-level Prisma packages into unrelated functions.
  included_files = ["!node_modules/.prisma/**", "!node_modules/@prisma/**"]
  ignored_node_modules = ["@prisma/client", "prisma"]


# Public checkout must bypass the Prisma-backed backend function entirely.
[[redirects]]
  from = "/api/public/campaign-packages"
  to = "/.netlify/functions/payments/campaign-packages"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/campaign-orders/verify"
  to = "/.netlify/functions/payments/campaign-orders/verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/campaign-orders"
  to = "/.netlify/functions/payments/campaign-orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/razorpay"
  to = "/.netlify/functions/payments/webhooks/razorpay"
  status = 200
  force = true

# All other API traffic continues to use the existing backend function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Keep one canonical origin for search engines. Point all four domains at this
# Netlify site, then the aliases will consolidate their SEO signals here.
[[redirects]]
  from = "/*"
  to = "https://theooro.com/:splat"
  status = 301
  force = true
  conditions = { Host = ["ooro.media", "www.ooro.media", "ooro.network", "www.ooro.network", "ooro.digital", "www.ooro.digital", "oroo.tech", "www.oroo.tech"] }

[[plugins]]
  package = "@netlify/plugin-nextjs"
